<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - ClassRoomPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center items-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8 mt-10">
        <div class="flex flex-col items-center mb-6">
            <i class="fas fa-user-shield text-4xl text-indigo-600 mb-2"></i>
            <h2 class="text-2xl font-bold text-indigo-700">Admin Sign In</h2>
            <p class="text-gray-500 text-sm mt-1">Only for system administrators</p>
        </div>
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div id="error-message" class="text-red-600 text-sm hidden"></div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition-colors font-semibold">Sign In as Admin</button>
        </form>
        <div class="mt-4 text-center">
            <a href="login.html" class="text-indigo-600 hover:underline">Back to User Sign In</a>
        </div>
    </div>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            if(email === 'admin@example.com' && password === 'password') {
                // Set admin user session
                const adminUser = {
                    name: 'Admin User',
                    email: 'admin@example.com',
                    isAdmin: true
                };
                localStorage.setItem('user', JSON.stringify(adminUser));
                window.location.href = 'admin.html';
            } else {
                errorDiv.textContent = 'Invalid admin credentials.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
